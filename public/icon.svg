<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kakeibo: libreta de cuentas con gráfica, sobre azul Discord -->
  <rect width="512" height="512" rx="116" fill="#5865F2"/>
  <g stroke="#17181b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- hojas detrás de la portada -->
    <rect x="152" y="122" width="268" height="292" rx="32" fill="#5EE6C2"/>
    <rect x="136" y="110" width="270" height="290" rx="30" fill="#ffffff"/>
    <!-- separador rojo -->
    <path d="M402 186 h4 a12 12 0 0 1 12 12 v42 a12 12 0 0 1 -12 12 h-4" fill="#ED4245"/>
    <!-- portada -->
    <rect x="118" y="100" width="250" height="262" rx="26" fill="#5865F2"/>
    <!-- borde inferior de las hojas -->
    <rect x="118" y="346" width="284" height="58" rx="26" fill="#ffffff"/>
    <!-- lomo -->
    <path d="M170 106 V350" fill="none"/>
    <!-- argollas -->
    <path d="M94 170 H150 M94 256 H150 M94 342 H150" fill="none"/>
  </g>
  <g fill="#5EE6C2">
    <!-- renglones -->
    <rect x="200" y="148" width="128" height="16" rx="8"/>
    <rect x="200" y="184" width="88" height="16" rx="8"/>
    <!-- barras -->
    <rect x="202" y="276" width="32" height="70" rx="3"/>
    <rect x="250" y="246" width="32" height="100" rx="3"/>
    <rect x="298" y="206" width="32" height="140" rx="3"/>
    <!-- línea del borde de hojas -->
    <rect x="186" y="369" width="190" height="12" rx="6"/>
  </g>
  <circle cx="158" cy="375" r="11" fill="#ED4245"/>
  <g fill="#17181b"><circle cx="94" cy="170" r="12"/><circle cx="94" cy="256" r="12"/><circle cx="94" cy="342" r="12"/></g>
</svg>
